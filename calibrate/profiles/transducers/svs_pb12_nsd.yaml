name: svs_pb12_nsd
min_boost_freq_hz: 25
max_boost_per_band_db: 6
max_boost_above_threshold_db: 8
transient_max_pulse_ms: 30
transient_max_boost_db: 15
freq_dependent_boost_threshold_hz: 30
max_cumulative_boost_db: 9
max_change_per_iter_db: 3
max_change_simulated_db: 6
hpf:
  freq: 18
  order: 4
notes: |
  SVS PB12-NSD, ported subwoofer with ~22 Hz port tune. Tight boost limits below
  30 Hz protect against port unloading; above the port tune the limit loosens
  to a thermal-only cap. Mandatory 4th-order Butterworth HPF at 18 Hz keeps
  infrasonic content out of the driver. Used as the default profile when none
  is explicitly declared.

  Sustained-boost cap (max_boost_above_threshold_db = 8) is the legacy
  thermal/excursion cap and protects against PEQ-style sustained gain at
  any one band. Transient-aware cap (transient_max_boost_db = 15, with
  pulse-width threshold 30 ms) lets brief Gabor anti-pulses from
  ``design_modal_fir`` exceed the sustained cap without exceeding driver
  damage thresholds — the FIR boost contributes to driver excursion only
  for the duration of the pulse, not as steady-state output.
