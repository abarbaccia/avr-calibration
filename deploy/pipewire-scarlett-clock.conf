# Lock PipeWire graph to 48 kHz / 256 frames to match CamillaDSP.
# Installs to: /etc/pipewire/pipewire.conf.d/10-scarlett-clock.conf
#
# Without this, PipeWire negotiates a higher default quantum (e.g. 1024)
# which forces an ALSA resampler insertion between PW and CamillaDSP,
# adding latency + a sample-rate-conversion step to the bass signal path.
context.properties = {
    default.clock.rate          = 48000
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 256
}
