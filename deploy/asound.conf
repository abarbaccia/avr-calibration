pcm.vc4hdmi_8ch {
    type plug
    slave {
        pcm "hw:CARD=vc4hdmi0,DEV=0"
        format IEC958_SUBFRAME_LE
        channels 8
        rate 48000
    }
}

# karaoke_out — stereo plug onto Scarlett PCM 1 / PCM 2 (which feed Mix A / Mix B
# inside the Scarlett, which feed Line 01 / Line 02 → Denon analog input → mains).
# NO dmix. Single-writer only. CamillaDSP holds hw:USB,0,0 exclusively during
# listening mode → any open() here returns EBUSY (Chromium audio sits silent,
# which is what we want). audio-mode stops CamillaDSP before karaoke, freeing
# the device so Chromium can grab PCM 1/2.
pcm.karaoke_out {
    type plug
    slave {
        pcm "hw:USB,0,0"
        channels 20
        rate 48000
        format S32_LE
    }
    ttable.0.0 1.0
    ttable.1.1 1.0
}
