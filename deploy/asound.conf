pcm.vc4hdmi_8ch {
    type plug
    slave {
        pcm "hw:CARD=vc4hdmi0,DEV=0"
        format IEC958_SUBFRAME_LE
        channels 8
        rate 48000
    }
}

# karaoke_out — DEPRECATED raw-hw plug onto Scarlett PCM 1/2. This grabbed
# hw:USB,0,0 exclusively, which forced CamillaDSP to be STOPPED before karaoke so
# Chromium could open the device (the two fought over the card). Karaoke now routes
# through PipeWire instead: the ALSA default (~/.asoundrc) is `type pipewire,
# playback_node karaoke_sink`, and `audio-mode wire` links karaoke_sink → Scarlett
# PCM 1/2. CamillaDSP stays running. This plug is kept only as an emergency fallback
# (point ~/.asoundrc's default back at it if PipeWire routing ever fails).
pcm.karaoke_out {
    type plug
    slave {
        pcm "hw:USB,0,0"
        channels 20
        rate 48000
        format S32_LE
    }
    ttable.0.0 1.0
    ttable.1.1 1.0
}
