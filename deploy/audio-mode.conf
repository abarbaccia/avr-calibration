# audio-mode configuration — read by /usr/local/sbin/denon-watch.sh
#
# DENON_HOST: AVR IP. Default 192.168.1.209.
DENON_HOST=192.168.1.209

# KARAOKE_TRIGGER_INPUT: Denon SI code that means "user is in karaoke."
# When the AVR is powered ON and SI matches this, audio-mode flips to karaoke.
# When it doesn't match (or AVR is in standby), audio-mode flips to listening.
#
# Common Denon SI codes: MPLAY, GAME, AUX1, AUX2, BT, CD, TUNER, NET, HEOS,
# IPOD, USB, BD, DVD, TV, SAT/CBL, PHONO.
#
# Leave empty to disable the bridge (denon-watch will idle).
KARAOKE_TRIGGER_INPUT=

# Poll interval in seconds.
POLL_INTERVAL_S=10
