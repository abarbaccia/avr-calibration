# avr_cal_sweep — permanent null sink for calibration sweeps.
# Created by PipeWire daemon at startup so it survives daemon/WP restarts.
# avr-cal-sweep-link.service links monitor_FL/FR → camilladsp_capture + loopback_ref.
# Deploy to: /etc/pipewire/pipewire.conf.d/10-avr-cal-sweep.conf
#
# session.suspend-timeout-seconds = 0 + node.pause-on-idle = false are LOAD-BEARING:
# a null sink has no hardware clock of its own — it is scheduled by the graph's
# driver (the Scarlett). WirePlumber's suspend-node.lua suspends idle nodes after
# 5 s by default. Once this sink suspends, its monitor mixer does not reliably
# resume on the next activation: pw-cat plays into playback_FL/FR but monitor_FL/FR
# stays silent (verified 2026-06-10 — loopback ref read -83 dBFS after ~11 h idle).
# That is the root cause of the chronic "subs need to warm up / first sweep has
# low coherence" symptom. Pinning the sink so it never suspends matches how the
# Scarlett is already handled (wireplumber-scarlett.lua) and fixes it permanently.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name                       = support.null-audio-sink
            node.name                          = avr_cal_sweep
            node.description                   = "AVR-Cal-Sweep"
            media.class                        = Audio/Sink
            audio.channels                     = 2
            audio.position                     = "FL,FR"
            session.suspend-timeout-seconds    = 0
            node.pause-on-idle                 = false
        }
    }
]
