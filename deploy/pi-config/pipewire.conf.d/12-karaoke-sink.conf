# karaoke_sink — 2-channel null sink: the PipeWire audio target for the Chromium
# karaoke kiosk. Chromium (PULSE_SINK=karaoke_sink) plays the PiKaraoke web UI's
# stereo audio into this sink; `audio-mode wire` then links its monitor to the
# Scarlett PCM 1/2 inputs:
#   karaoke_sink:monitor_FL → Scarlett:playback_AUX0  (PCM 1 → Mix A → Line 01)
#   karaoke_sink:monitor_FR → Scarlett:playback_AUX1  (PCM 2 → Mix B → Line 02)
# Line 01/02 → Denon analog input → mains (and the Denon bass-manages to its sub
# pre-out, which returns via Scarlett input 3 → CamillaDSP → subs, exactly as in
# listening mode). This REPLACES the old raw-ALSA karaoke_out plug (hw:USB,0,0),
# which forced an exclusive device grab and required stopping CamillaDSP. Going
# through PipeWire means CamillaDSP stays running and nothing fights over the card.
# Deploy to: /etc/pipewire/pipewire.conf.d/12-karaoke-sink.conf
#
# session.suspend-timeout-seconds = 0 + node.pause-on-idle = false are LOAD-BEARING
# (same as 10-avr-cal-sweep.conf / 11-loopback-ref.conf): a suspended null sink stops
# passing audio to its monitor, silently muting karaoke between tracks. Pin it hot.
#
# NOTE: do NOT set node.dont-reconnect=true here (unlike loopback_ref). This sink's
# whole job is to RECEIVE the Chromium kiosk's audio (Chromium targets it via
# PULSE_SINK=karaoke_sink). dont-reconnect made the routing layer reject the targeted
# stream, leaving it orphaned at Sink:-1 (silent karaoke). The monitor→Scarlett links
# are still created explicitly by `audio-mode wire`, not by WP autoconnect.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name                       = support.null-audio-sink
            node.name                          = karaoke_sink
            node.description                   = "Karaoke-Out"
            media.class                        = Audio/Sink
            audio.channels                     = 2
            audio.position                     = "FL,FR"
            session.suspend-timeout-seconds    = 0
            node.pause-on-idle                 = false
        }
    }
]
