# loopback_ref — 2-channel null sink: the SINGLE sample-locked capture node (R11).
#   ch0 (FL) ← avr_cal_sweep:monitor_FL  = the pre-DSP stimulus (deconvolution ref X)
#   ch1 (FR) ← UMIK source                = the acoustic room response (mic Y)
# The measurement engine records THIS ONE node (2 ch) and deconvolves Y(ch1)/X(ch0).
# Because both arrive in one pw-record stream they are sample-locked by construction
# — there is no inter-stream start offset to corrupt the deconvolution (R11, see
# docs/pipewire-architecture.md §6b). The UMIK rides PW's resampler onto the graph
# clock on its way into this sink (R6 preserved). Both links are created explicitly
# by `audio-mode wire`.
# Deploy to: /etc/pipewire/pipewire.conf.d/11-loopback-ref.conf
#
# session.suspend-timeout-seconds = 0 + node.pause-on-idle = false are LOAD-BEARING
# for the same reason as 10-avr-cal-sweep.conf: a suspended null sink stops passing
# audio to its monitor, silently killing the deconvolution reference. Pin it hot.
#
# node.dont-reconnect = true (2026-06-13):
#   WirePlumber's policy-node.lua treats any Audio/Sink as a valid fallback target for
#   autoconnect=true streams. During the CamillaDSP startup race (playback node created
#   before the Scarlett link is established) WP's fallback routed all 20
#   camilladsp_playback outputs into loopback_ref, contaminating the deconvolution
#   reference with live processed sub signal → mic ≈ reference → "suspiciously flat FR"
#   measurement failures. Setting dont-reconnect=true makes WP skip this node entirely
#   when searching for fallback targets. The two correct links
#   (avr_cal_sweep:monitor_FL → loopback_ref:playback_FL = ref; UMIK:capture_FL →
#   loopback_ref:playback_FR = mic) are created explicitly by audio-mode wire, not WP.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name                       = support.null-audio-sink
            node.name                          = loopback_ref
            node.description                   = "Loopback-Ref"
            media.class                        = Audio/Sink
            audio.channels                     = 2
            audio.position                     = "FL,FR"
            session.suspend-timeout-seconds    = 0
            node.pause-on-idle                 = false
            node.dont-reconnect                = true
        }
    }
]
