# loopback_ref — mono null sink that captures camilladsp output_5.
# The measurement engine (LoopbackRefPlayback) records from this node
# as the deconvolution reference for USB sub sweeps.
# Replaces the now-deleted denon-sub-bridge.service which created this sink.
# Deploy to: /etc/pipewire/pipewire.conf.d/11-loopback-ref.conf
#
# session.suspend-timeout-seconds = 0 + node.pause-on-idle = false are LOAD-BEARING
# for the same reason as 10-avr-cal-sweep.conf: a suspended null sink stops passing
# audio to its monitor, silently killing the deconvolution reference. Pin it hot.
context.objects = [
    {
        factory = adapter
        args = {
            factory.name                       = support.null-audio-sink
            node.name                          = loopback_ref
            node.description                   = "Loopback-Ref"
            media.class                        = Audio/Sink
            audio.channels                     = 1
            channel_map                        = mono
            session.suspend-timeout-seconds    = 0
            node.pause-on-idle                 = false
        }
    }
]
